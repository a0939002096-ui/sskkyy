<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sskkyy | Glassmorphism</title>
  <style>
    /* ==========================================================================
       1. 全局重置與核心變數
       ========================================================================== */
    :root {
      --bg-gradient: radial-gradient(circle at 50% -20%, #1a1c2e, #0a0b10 80%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-bg-hover: rgba(255, 255, 255, 0.09);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-glow: rgba(0, 242, 254, 0.4);
      
      --text-primary: #f0f3f8;
      --text-secondary: #94a3b8;
      --accent-cyan: #00f2fe;
      --accent-purple: #4facfe;
      
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      --blur-amount: blur(16px);
      --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* ==========================================================================
       2. 背景動態光暈
       ========================================================================== */
    .glow-sphere {
      position: fixed;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.3) 0%, rgba(79, 172, 254, 0.1) 50%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: -1;
      filter: blur(60px);
      transition: all 0.6s var(--transition-smooth);
    }

    .glow-sphere.active {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255, 0, 128, 0.3) 0%, rgba(120, 0, 255, 0.15) 50%, rgba(0, 0, 0, 0) 70%);
    }

    /* ==========================================================================
       3. 玻璃擬物卡片容器
       ========================================================================== */
    .glass-card {
      width: 90%;
      max-width: 480px;
      padding: 2.5rem;
      background: var(--glass-bg);
      backdrop-filter: var(--blur-amount);
      -webkit-backdrop-filter: var(--blur-amount);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: var(--glass-shadow);
      transition: transform 0.4s var(--transition-smooth), border-color 0.4s var(--transition-smooth);
    }

    .glass-card:hover {
      border-color: var(--glass-border-glow);
      transform: translateY(-4px);
    }

    /* ==========================================================================
       4. 元件樣式
       ========================================================================== */
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--accent-cyan);
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 20px;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #ffffff 30%, var(--text-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .glass-btn {
      width: 100%;
      padding: 1rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.3s var(--transition-smooth);
    }

    .glass-btn:hover {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border-color: transparent;
      color: #000;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
    }
  </style>
</head>
<body>
  <div class="glow-sphere"></div>
  <main class="glass-card">
    <div class="badge">PROTOTYPE</div>
    <h1>sskkyy</h1>
    <p>基於 Glassmorphism 設計語彙與暗黑調性的極簡 Web 介面。</p>
    <button class="glass-btn" onclick="toggleGlow()">切換光暈效果</button>
  </main>

  <script>
    function toggleGlow() {
      const sphere = document.querySelector('.glow-sphere');
      sphere.classList.toggle('active');
    }
  </script>
</body>
</html>
